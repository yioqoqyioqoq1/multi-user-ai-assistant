[project]
name = "multi-user-ai-assistant"
version = "0.1.0"
description = "多用户 AI 智能助理平台（FastAPI + LangGraph + MCP）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "wikipedia>=1.4.0",
    "langchain>=1.0",
    "langchain-community>=0.3",
    "langchain-core>=1.0",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "PyJWT>=2.9",
    "pwdlib[argon2]>=0.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]